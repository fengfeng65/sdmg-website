<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>贪吃蛇</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0b0f14;color:#e6edf3;
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  user-select:none;-webkit-user-select:none;touch-action:none}
#wrap{display:flex;flex-direction:column;height:100%;padding:10px;gap:10px}
#hud{display:flex;align-items:center;gap:10px;font-size:14px;flex:0 0 auto}
.card{background:#131c26;border:1px solid #1e2a38;border-radius:10px;padding:6px 12px;line-height:1.3}
.card b{color:#3ddc84;font-size:18px;font-variant-numeric:tabular-nums}
.card span{display:block;font-size:11px;color:#7d8da1}
#hud .sp{flex:1}
#btnPause,#btnReset{background:#1b2735;border:1px solid #2a3a4d;color:#cbd5e1;
  border-radius:10px;padding:10px 14px;font-size:13px;font-weight:600}
#btnReset{background:#3ddc84;border-color:#3ddc84;color:#06210f}
#stage{flex:1 1 auto;display:flex;align-items:center;justify-content:center;min-height:0}
canvas{display:block;border-radius:16px;background:#0f1620;
  box-shadow:0 0 0 1px #1e2a38,0 10px 34px rgba(0,0,0,.65)}
#pad{flex:0 0 auto;display:grid;grid-template-columns:repeat(3,62px);
  grid-template-rows:repeat(2,62px);gap:8px;justify-content:center;padding-bottom:4px}
#pad button{background:#16202c;border:1px solid #253347;color:#9fb3c8;
  border-radius:14px;font-size:20px;line-height:1;transition:background .08s,transform .08s}
#pad button:active{background:#22384d;color:#3ddc84;transform:scale(.94)}
#pad .ph{visibility:hidden}
#over{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(6,10,14,.82);backdrop-filter:blur(3px);z-index:9}
#over.on{display:flex}
#box{background:#131c26;border:1px solid #26374a;border-radius:18px;padding:26px 30px;
  text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.7);min-width:220px}
#box h2{margin:0 0 6px;font-size:22px;color:#3ddc84}
#box p{margin:6px 0;color:#8ea3b8;font-size:14px}
#box button{margin-top:16px;background:#3ddc84;border:0;color:#06210f;font-weight:700;
  border-radius:12px;padding:12px 28px;font-size:15px}
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div class="card"><span>得分</span><b id="sc">0</b></div>
    <div class="card"><span>最高</span><b id="bs">0</b></div>
    <div class="sp"></div>
    <button id="btnPause">暂停</button>
    <button id="btnReset">重开</button>
  </div>
  <div id="stage"><canvas id="cv"></canvas></div>
  <div id="pad">
    <button class="ph"></button><button data-d="U">▲</button><button class="ph"></button>
    <button data-d="L">◀</button><button data-d="D">▼</button><button data-d="R">▶</button>
  </div>
</div>
<div id="over"><div id="box">
  <h2 id="ovTitle">游戏结束</h2>
  <p id="ovSub">得分 0</p>
  <button id="ovBtn">再来一局</button>
</div></div>
<script>
(function(){
'use strict';
var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
var scEl=document.getElementById('sc'), bsEl=document.getElementById('bs');
var over=document.getElementById('over'), ovTitle=document.getElementById('ovTitle'),
    ovSub=document.getElementById('ovSub'), ovBtn=document.getElementById('ovBtn');
var COLS=17, ROWS=17, CELL=20;
var snake, dir, pend, food, score=0, best=0, alive=true, paused=false;
var acc=0, last=0, stepMs=150, tick=0;

try{ best=parseInt(localStorage.getItem('snake_best')||'0',10)||0; }catch(e){ best=0; }
bsEl.textContent=best;

function fit(){
  var stage=document.getElementById('stage');
  var w=stage.clientWidth, h=stage.clientHeight;
  var size=Math.min(w,h);
  CELL=Math.max(10,Math.floor(size/COLS));
  var px=CELL*COLS;
  cv.width=px; cv.height=px;
  cv.style.width=px+'px'; cv.style.height=px+'px';
}
function reset(){
  var c=Math.floor(COLS/2), r=Math.floor(ROWS/2);
  snake=[{x:c,y:r},{x:c-1,y:r},{x:c-2,y:r}];
  dir={x:1,y:0}; pend=null; score=0; acc=0; alive=true; paused=false;
  stepMs=150; tick=0;
  scEl.textContent='0';
  document.getElementById('btnPause').textContent='暂停';
  over.classList.remove('on');
  placeFood();
}
function placeFood(){
  var free=[];
  for(var y=0;y<ROWS;y++)for(var x=0;x<COLS;x++){
    var hit=false;
    for(var i=0;i<snake.length;i++) if(snake[i].x===x&&snake[i].y===y){hit=true;break;}
    if(!hit) free.push({x:x,y:y});
  }
  food = free.length? free[Math.floor(Math.random()*free.length)] : null;
}
function turn(d){
  var v={U:{x:0,y:-1},D:{x:0,y:1},L:{x:-1,y:0},R:{x:1,y:0}}[d];
  if(!v) return;
  var base = pend||dir;
  if(v.x===-base.x && v.y===-base.y) return;   // 不能180度掉头
  pend=v;
}
function step(){
  if(pend){ dir=pend; pend=null; }
  var head={x:snake[0].x+dir.x, y:snake[0].y+dir.y};
  if(head.x<0||head.y<0||head.x>=COLS||head.y>=ROWS){ return die(); }
  for(var i=0;i<snake.length-1;i++)
    if(snake[i].x===head.x&&snake[i].y===head.y) return die();
  snake.unshift(head);
  if(food && head.x===food.x && head.y===food.y){
    score+=10; scEl.textContent=score;
    if(score>best){ best=score; bsEl.textContent=best;
      try{ localStorage.setItem('snake_best',String(best)); }catch(e){} }
    if(stepMs>70) stepMs-=3;
    placeFood();
  } else snake.pop();
}
function die(){
  alive=false;
  ovTitle.textContent='游戏结束';
  ovSub.textContent='本局得分 '+score+'　最高 '+best;
  over.classList.add('on');
}
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function draw(){
  var px=CELL*COLS;
  ctx.clearRect(0,0,px,px);
  // 网格
  ctx.strokeStyle='rgba(255,255,255,.028)'; ctx.lineWidth=1;
  for(var i=1;i<COLS;i++){
    ctx.beginPath(); ctx.moveTo(i*CELL+.5,0); ctx.lineTo(i*CELL+.5,px); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,i*CELL+.5); ctx.lineTo(px,i*CELL+.5); ctx.stroke();
  }
  // 食物
  if(food){
    var p=1+Math.sin(tick/6)*0.10;
    var fx=(food.x+.5)*CELL, fy=(food.y+.5)*CELL, fr=CELL*0.32*p;
    ctx.save();
    ctx.shadowColor='#ff5a5f'; ctx.shadowBlur=CELL*0.9;
    ctx.fillStyle='#ff5a5f';
    ctx.beginPath(); ctx.arc(fx,fy,fr,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
  // 蛇
  var n=snake.length;
  for(var k=n-1;k>=0;k--){
    var s=snake[k], t=k/Math.max(1,n-1);
    ctx.save();
    if(k===0){ ctx.shadowColor='rgba(61,220,132,.95)'; ctx.shadowBlur=CELL*0.85; }
    ctx.fillStyle = k===0 ? '#5ef2a0' : 'rgba(61,220,132,'+(0.95-0.5*t)+')';
    var pad = k===0 ? 1 : 1.5+t*1.2;
    rr(s.x*CELL+pad, s.y*CELL+pad, CELL-pad*2, CELL-pad*2, CELL*0.28);
    ctx.fill();
    ctx.restore();
  }
  // 眼睛
  if(alive && snake.length){
    var h0=snake[0];
    var cx=(h0.x+.5)*CELL, cy=(h0.y+.5)*CELL, e=CELL*0.11;
    var ox=dir.y!==0? CELL*0.20:0, oy=dir.x!==0? CELL*0.20:0;
    ctx.fillStyle='#06210f';
    ctx.beginPath(); ctx.arc(cx+ox-dir.x*CELL*0.06, cy+oy-dir.y*CELL*0.06, e,0,6.283); ctx.fill();
    ctx.beginPath(); ctx.arc(cx-ox-dir.x*CELL*0.06, cy-oy-dir.y*CELL*0.06, e,0,6.283); ctx.fill();
  }
}
function loop(ts){
  requestAnimationFrame(loop);
  if(!last) last=ts;
  var dt=Math.min(120, ts-last); last=ts;
  if(alive && !paused){ acc+=dt; while(acc>=stepMs){ acc-=stepMs; step(); if(!alive)break; } }
  tick++; draw();
}
// 触摸滑动
var sx=0, sy=0, tracking=false;
function tstart(e){
  var t=e.touches?e.touches[0]:e; sx=t.clientX; sy=t.clientY; tracking=true;
}
function tmove(e){
  if(!tracking) return;
  var t=e.touches?e.touches[0]:e;
  var dx=t.clientX-sx, dy=t.clientY-sy;
  if(Math.abs(dx)<24 && Math.abs(dy)<24) return;
  if(Math.abs(dx)>Math.abs(dy)) turn(dx>0?'R':'L'); else turn(dy>0?'D':'U');
  sx=t.clientX; sy=t.clientY;
  if(e.cancelable) e.preventDefault();
}
function tend(){ tracking=false; }
var wrap=document.getElementById('wrap');
wrap.addEventListener('touchstart',tstart,{passive:true});
wrap.addEventListener('touchmove',tmove,{passive:false});
wrap.addEventListener('touchend',tend,{passive:true});
wrap.addEventListener('mousedown',tstart);
wrap.addEventListener('mousemove',function(e){ if(tracking) tmove(e); });
wrap.addEventListener('mouseup',tend);
// 方向键
document.getElementById('pad').addEventListener('click',function(e){
  var b=e.target.closest('button[data-d]'); if(b) turn(b.dataset.d);
});
document.addEventListener('keydown',function(e){
  var m={ArrowUp:'U',ArrowDown:'D',ArrowLeft:'L',ArrowRight:'R',
         w:'U',s:'D',a:'L',d:'R',W:'U',S:'D',A:'L',D:'R'}[e.key];
  if(m){ turn(m); e.preventDefault(); }
  if(e.key===' '){ togglePause(); e.preventDefault(); }
});
function togglePause(){
  if(!alive) return;
  paused=!paused;
  document.getElementById('btnPause').textContent = paused?'继续':'暂停';
}
document.getElementById('btnPause').onclick=togglePause;
document.getElementById('btnReset').onclick=function(){ reset(); };
ovBtn.onclick=function(){ reset(); };
window.addEventListener('resize',function(){ fit(); });
document.addEventListener('visibilitychange',function(){
  if(document.hidden && alive){ paused=true;
    document.getElementById('btnPause').textContent='继续'; }
});
fit(); reset(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
