<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的个人主页</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .card {
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 50px 40px;
      text-align: center;
      max-width: 480px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.2);
    }
    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
    }
    h1 { font-size: 28px; margin-bottom: 8px; }
    .subtitle { opacity: 0.85; margin-bottom: 25px; font-size: 16px; }
    .links a {
      display: inline-block;
      margin: 5px 8px;
      padding: 8px 18px;
      background: rgba(255,255,255,0.2);
      color: #fff;
      text-decoration: none;
      border-radius: 20px;
      transition: all 0.3s;
      font-size: 14px;
    }
    .links a:hover { background: rgba(255,255,255,0.4); transform: translateY(-2px); }
    footer { margin-top: 30px; font-size: 12px; opacity: 0.6; }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">👨‍💻</div>
    <h1>你好，我是 [你的名字]</h1>
    <p class="subtitle">欢迎来到我的个人主页 · sdmg.cc.cd</p>
    <p style="font-size:14px; opacity:0.9; margin-bottom:20px;">
      这里可以放你的自我介绍、技能、项目展示等
    </p>
    <div class="links">
      <a href="#">GitHub</a>
      <a href="#">博客</a>
      <a href="#">联系我</a>
    </div>
    <footer>© 2026 我的个人网站 · Powered by Cloudflare</footer>
  </div>
</body>
</html>
